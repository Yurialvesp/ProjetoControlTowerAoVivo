# This is a Declarative Automation Bundle definition for verticeaovivo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: verticeaovivo
  uuid: f70d2d03-ef99-4d63-846e-43fca162fc88

include:
  - resources/*.yml

sync:
  exclude:
    - minha-torre/**

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
    default: lakehouse_vertice
  warehouse_id:
    description: The SQL warehouse ID to use
    default: d04c9f02eff32f93

targets:
  dev:
    default: true
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-c3e7e818-d0c5.cloud.databricks.com
    variables:
      catalog: lakehouse_vertice
      warehouse_id: d04c9f02eff32f93
  prod:
    mode: production
    workspace:
      host: https://dbc-c3e7e818-d0c5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/yurialvesp@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/yurialvesp@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakehouse_vertice
      warehouse_id: d04c9f02eff32f93
    permissions:
      - user_name: yurialvesp@gmail.com
        level: CAN_MANAGE
